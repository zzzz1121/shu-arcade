<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>蜀地消消乐</title><link rel="stylesheet" href="style.css"><a class="arcade-back" href="../../index.html" aria-label="返回游戏大厅">‹ 游戏大厅</a><main><header><span>蜀地闲游 · 茶余一局</span><button id="audio" aria-pressed="false">♫ 音乐关</button><button id="sfx" aria-pressed="true">音效开</button><button id="restart">重新开始</button></header><h1>蜀地消消乐</h1><p class="intro">拾三件百物，消一缕闲愁</p><section class="status"><button id="choose">选关</button><b id="level"></b><span id="progress"></span></section><div class="meter"><i id="meter"></i></div><section id="board" aria-label="叠牌区域"></section><p id="tip" role="status">点击亮牌，三个相同物件即可消除</p><section id="tray" aria-label="七格暂存槽"></section><div class="tray-label">暂存槽 <b id="count">0 / 7</b></div><section id="reserve" aria-label="移出区"></section><nav><button id="undo">↶<span>撤回一步</span><small>剩余 1 次</small></button><button id="shuffle">⤨<span>重新洗牌</span><small>剩余 1 次</small></button><button id="move">▱<span>移出三张</span><small>剩余 1 次</small></button></nav><footer>下层牌被遮挡时不可选 · 暂存槽满则挑战结束</footer><dialog><h2 id="result"></h2><p id="detail"></p><button id="again">再来一局</button></dialog><dialog id="levels"><h2>蜀地行程</h2><p id="save-status">进度自动保存在本机浏览器</p><div id="level-list"></div><button id="close-levels">继续游戏</button><button id="clear-progress" class="danger">清除进度</button></dialog><dialog id="clear-confirm"><h2>清除全部进度？</h2><p>将清除当前牌局、通关记录和已解锁关卡，回到第一关。此操作无法撤销。</p><button id="cancel-clear">保留进度</button><button id="confirm-clear" class="danger">确认清除</button></dialog></main><script src="compat.js"></script><script src="game.js"></script></html>
